<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95E879"/>
      <stop offset="100%" style="stop-color:#6BCBFF"/>
    </linearGradient>
  </defs>
  <style>
    .popper { transform-box: fill-box; transform-origin: 50% 100%; animation: pop 1.6s ease-in-out infinite; }
    @keyframes pop {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(-2deg); }
    }
    .confetti-bit { transform-box: fill-box; transform-origin: 50% 50%; animation: drift 2.4s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(16px) rotate(180deg); }
    }
  </style>
  <rect width="800" height="1000" fill="url(#g4)"/>

  <g class="popper">
    <path d="M330 660 L 470 660 L 430 540 L 370 540 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M370 540 L 430 540 L 400 480 Z" fill="#ffe3ef"/>
  </g>

  <rect class="confetti-bit" x="260" y="420" width="14" height="14" fill="#ff6b9d" style="animation-delay:0s"/>
  <rect class="confetti-bit" x="500" y="400" width="14" height="14" fill="#ffd93d" style="animation-delay:.3s"/>
  <circle class="confetti-bit" cx="330" cy="380" r="9" fill="#6bcbff" style="animation-delay:.6s"/>
  <circle class="confetti-bit" cx="470" cy="370" r="9" fill="#c44dff" style="animation-delay:.9s"/>
  <rect class="confetti-bit" x="400" y="330" width="14" height="14" fill="#95e879" style="animation-delay:1.2s"/>
  <circle class="confetti-bit" cx="230" cy="480" r="8" fill="#ffb347" style="animation-delay:.2s"/>
  <circle class="confetti-bit" cx="560" cy="470" r="8" fill="#ff8fc0" style="animation-delay:.5s"/>

  <text x="400" y="860" font-family="Georgia,serif" font-size="32" text-anchor="middle" fill="#ffffff" opacity="0.85">Pop the confetti</text>
</svg>
