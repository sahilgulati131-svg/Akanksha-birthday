  <rect width="800" height="1000" fill="url(#g7)"/>

  <!-- cupcake wrapper -->
  <path d="M290 640 L 510 640 L 470 760 L 330 760 Z" fill="#ffffff" opacity="0.95"/>
  <line x1="310" y1="650" x2="345" y2="750" stroke="#ffb3d9" stroke-width="8"/>
  <line x1="360" y1="650" x2="380" y2="750" stroke="#ffb3d9" stroke-width="8"/>
  <line x1="420" y1="650" x2="420" y2="750" stroke="#ffb3d9" stroke-width="8"/>
  <line x1="470" y1="650" x2="450" y2="750" stroke="#ffb3d9" stroke-width="8"/>

  <!-- frosting swirl -->
  <ellipse cx="400" cy="620" rx="130" ry="55" fill="#ffe3ef"/>
  <ellipse cx="400" cy="565" rx="105" ry="50" fill="#ffe3ef"/>
  <ellipse cx="400" cy="515" rx="78" ry="45" fill="#ffe3ef"/>
  <ellipse cx="400" cy="470" rx="45" ry="35" fill="#ffe3ef"/>

